name: "Build Frontend Assets"

on:
  pull_request:
    branches:
      - main
    paths:
      - "frontend/**"

permissions:
  contents: write
  pull-requests: write

jobs:
  build-frontend:
    name: "Build and commit static assets"
    runs-on: ubuntu-latest
    steps:
      - name: Checkout PR branch
        uses: actions/checkout@v5
        with:
          ref: ${{ github.head_ref }}
          fetch-depth: 0

      - name: Check if static/ assets were already updated
        id: check-static
        run: |
          git fetch origin ${{ github.base_ref }}
          CHANGED=$(git diff --name-only origin/${{ github.base_ref }}...HEAD -- static/ \
            | grep -v '^static/whisper' || true)
          if [ -n "$CHANGED" ]; then
            echo "Static assets already updated — skipping build"
            echo "skip=true" >> "$GITHUB_OUTPUT"
          else
            echo "Static assets not updated — will build"
            echo "skip=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Comment on fork PR to build static assets
        if: |
          steps.check-static.outputs.skip == 'false' &&
          github.event.pull_request.head.repo.fork == true
        uses: actions/github-script@v7
        with:
          script: |
            github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
              body: [
                '### Frontend static assets not built',
                '',
                'You changed files in `frontend/` but the compiled `static/` assets are not included in this PR.',
                'Please run the following and push the result:',
                '',
                '```sh',
                'make frontend',
                'git add static/',
                'git commit -m "ci: build frontend static assets"',
                'git push',
                '```',
              ].join('\n')
            })

      - name: Install pnpm
        if: |
          steps.check-static.outputs.skip == 'false' &&
          github.event.pull_request.head.repo.fork == false
        uses: pnpm/action-setup@v4
        with:
          package_json_file: frontend/package.json

      - name: Set up Node.js
        if: |
          steps.check-static.outputs.skip == 'false' &&
          github.event.pull_request.head.repo.fork == false
        uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: "pnpm"
          cache-dependency-path: frontend/pnpm-lock.yaml

      - name: Build frontend
        if: |
          steps.check-static.outputs.skip == 'false' &&
          github.event.pull_request.head.repo.fork == false
        # Use the Makefile target rather than calling pnpm directly: it prunes
        # stale hashed bundles from static/ before building (vite runs with
        # emptyOutDir:false, so nothing else removes them) and it is the same
        # command the fork-PR comment above asks contributors to run. Calling
        # `pnpm run build` here instead let orphaned assets accumulate in
        # static/ and get embedded into every binary by //go:embed.
        run: make frontend

      - name: Commit static assets
        if: |
          steps.check-static.outputs.skip == 'false' &&
          github.event.pull_request.head.repo.fork == false
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add static/
          if git diff --staged --quiet; then
            echo "No changes to static/ after build (assets already up to date)"
          else
            git commit -m "ci: build frontend static assets"
            git push
          fi
