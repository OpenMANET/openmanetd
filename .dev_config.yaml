logLevel: debug
meshNetInterface: eth0
dbFile: bin/openmanetd.db
gnss:
  enable: false
  sendAsExternalGNSSSource:
    sendAsNMEA: false
    sendAsCoT: false
alfred:
  mode: primary
  batInterface: bat0
  socketPath: /var/run/alfred.sock
  # Drop peers not heard over Alfred for this long so their mesh address and
  # DHCP window are released. Go duration string; 0 disables expiry.
  nodeExpiry: 24h
  dataTypes:
    gateway: true
    node: true
    addressReservation: true
batman:
  # true (default) => bat0.multicast_mode=0 (classic flooding, shipped state);
  # false => multicast_mode=1 (batman-adv IGMP/MLD-snooping optimisations on).
  multicastForceflood: true
blos:
  enable: false
comms:
  enable: false
  protocol: rtp
  # openvlm (default, Open Voice Link Module USB HID dongle GPIO3), evdev, or bluealsa_xevent
  controlSource: openvlm
  debug: true
  loopback: false
  trace: true
  nanoPTT:
    enable: false
    devicePath: /dev/hidraw0/*
    deviceName: Generic AB13X USB Audio
  bluetoothPtt:
    enable: false
    audioDeviceHint: ""
    inputDevice: ""
    outputDevice: ""
